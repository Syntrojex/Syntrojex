name: Update profile cards

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["scripts/generate_cards.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate streak card
        run: python scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Syntrojex

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          git diff --staged --quiet || (git commit -m "chore: update streak card" && git push)

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # If the last commit is older than 45 days, add an empty commit to keep it alive.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflow alive" && git push
          fi
