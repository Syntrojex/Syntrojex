<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub streak" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>GitHub streak</title>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1426"/><stop offset=".6" stop-color="#0f1f33"/><stop offset="1" stop-color="#0b3a4d"/></linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#00EAFF"/><stop offset=".3" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#0095AD"/><stop offset="1" stop-color="#00EAFF"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect x=".5" y=".5" width="494" height="194" rx="18" fill="url(#bg)" stroke="#1f4560"/>
<g class="r" style="animation-delay:0.10s"><text x="82.5" y="104" font-size="42" font-weight="700" letter-spacing="-1" text-anchor="middle" fill="#FFFFFF">2,257</text><text x="82.5" y="130" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle" fill="#8FA6B8">TOTAL CONTRIBUTIONS</text><text x="82.5" y="149" font-size="12" text-anchor="middle" fill="#5B7A90">Nov 9, 2025 – Present</text></g>
<g class="r" style="animation-delay:0.22s"><text x="247.5" y="104" font-size="42" font-weight="700" letter-spacing="-1" text-anchor="middle" fill="url(#shine)">173</text><text x="247.5" y="130" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle" fill="#8FA6B8">CURRENT STREAK</text><text x="247.5" y="149" font-size="12" text-anchor="middle" fill="#5B7A90">May 26 – Nov 14</text></g>
<g class="r" style="animation-delay:0.34s"><text x="412.5" y="104" font-size="42" font-weight="700" letter-spacing="-1" text-anchor="middle" fill="#FFFFFF">173</text><text x="412.5" y="130" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle" fill="#8FA6B8">LONGEST STREAK</text><text x="412.5" y="149" font-size="12" text-anchor="middle" fill="#5B7A90">May 26 – Nov 14</text></g>
<line x1="165" x2="165" y1="50" y2="150" stroke="#1f4560"/>
<line x1="330" x2="330" y1="50" y2="150" stroke="#1f4560"/>
<defs><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0"><stop offset="0" stop-color="#00EAFF" stop-opacity="0"/><stop offset=".5" stop-color="#00EAFF" stop-opacity=".95"/><stop offset="1" stop-color="#00EAFF" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-220 0;495 0;495 0" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/></linearGradient></defs><rect x=".75" y=".75" width="493.5" height="193.5" rx="18" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>