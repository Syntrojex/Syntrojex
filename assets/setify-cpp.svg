<svg xmlns="http://www.w3.org/2000/svg" width="430" height="190" viewBox="0 0 430 190" role="img" aria-label="Setify C++" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>Setify C++</title>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.5}40%{opacity:1}}
@keyframes wave{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1426"/><stop offset=".6" stop-color="#0f1f33"/><stop offset="1" stop-color="#0b3a4d"/></linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#00EAFF"/><stop offset=".3" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#0095AD"/><stop offset="1" stop-color="#00EAFF"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<defs><pattern id="dots2" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#00EAFF" fill-opacity=".10"/></pattern><linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00EAFF"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs>
<rect x=".5" y=".5" width="429" height="189" rx="12" fill="#0b1220" stroke="#1b3550"/>
<rect x=".5" y=".5" width="429" height="189" rx="12" fill="url(#dots2)"/>
<rect x="0" y="18" width="4" height="154" rx="2" fill="url(#acc)"/>
<g class="r" style="animation-delay:.1s"><text x="28" y="34" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5B7A90">~/extensions/<tspan fill="#00EAFF">setify-cpp</tspan></text>
<rect x="344.8" y="18" width="63.2" height="22" rx="6" fill="#00EAFF" fill-opacity=".12" stroke="#00EAFF" stroke-opacity=".5"/><text x="376.4" y="33" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#00EAFF">v1.1.6</text>
</g>
<g class="r" style="animation-delay:.2s"><text x="28" y="72" font-size="25" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-.5" fill="#FFFFFF">Setify C++<tspan fill="#00EAFF" style="animation:blink 1.1s steps(1) infinite">_</tspan></text></g>
<g class="r" style="animation-delay:0.30s"><text x="28" y="96" font-size="12" fill="#8FA6B8">Installs and wires up a full C++ compiler (MinGW-w64)</text></g>
<g class="r" style="animation-delay:0.38s"><text x="28" y="113" font-size="12" fill="#8FA6B8">into VS Code automatically.</text></g>
<g class="r" style="animation-delay:.7s"><text x="28" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00EAFF">#vscode</text><text x="93.1" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#4F8CFF">#mingw-w64</text><text x="180.1" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7C6CFF">#cpp</text></g>
<defs><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0"><stop offset="0" stop-color="#00EAFF" stop-opacity="0"/><stop offset=".5" stop-color="#00EAFF" stop-opacity=".95"/><stop offset="1" stop-color="#00EAFF" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-220 0;430 0;430 0" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/></linearGradient></defs><rect x=".75" y=".75" width="428.5" height="188.5" rx="12" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>